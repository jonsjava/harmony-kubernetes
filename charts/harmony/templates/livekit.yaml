{{- if .Values.livekit.enabled }}
{{- $c := "livekit" }}
{{- $v := .Values.livekit }}
{{- $ctx := dict "root" . "component" $c }}
{{- $rtc := dict "tcp_port" (int $v.rtc.tcpPort) "udp_port" (int $v.rtc.udpPort) "use_ice_lite" true }}
{{- if $v.rtc.nodeIP }}
{{- $_ := set $rtc "node_ip" $v.rtc.nodeIP }}
{{- else }}
{{- $_ := set $rtc "use_external_ip" $v.rtc.useExternalIP }}
{{- end }}
{{- $redis := dict "address" (printf "%s:%s" (include "harmony.redisHost" .) (include "harmony.redisPort" .)) "password" "$(REDIS_PASSWORD)" }}
{{- if and (not .Values.redis.enabled) .Values.redis.external.tls }}
{{- $_ := set $redis "use_tls" true }}
{{- end }}
{{- $config := dict
      "port" 7880
      "log_level" $v.logLevel
      "keys" (dict "$(LIVEKIT_API_KEY)" "$(LIVEKIT_API_SECRET)")
      "rtc" $rtc
      "turn" (dict "enabled" false)
      "room" (dict "empty_timeout" 300 "departure_timeout" 20)
      "redis" $redis
      "webhook" (dict "api_key" "$(LIVEKIT_API_KEY)" "urls" (list (printf "http://%s:3001/api/livekit/webhook" (include "harmony.componentName" (dict "root" . "component" "federation-server")))))
}}
{{- $config = mustMergeOverwrite $config (deepCopy $v.extraConfig) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harmony.componentName" $ctx }}
  labels:
    {{- include "harmony.labels" $ctx | nindent 4 }}
spec:
  # One SFU: rooms live in one process, and its media ports are fixed.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "harmony.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harmony.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ $config | toJson | sha256sum | trunc 16 }}
    spec:
      {{- include "harmony.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "harmony.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if $v.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: livekit
          image: {{ include "harmony.thirdPartyImage" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "harmony.env.secret" (dict "root" . "name" "LIVEKIT_API_KEY") | nindent 12 }}
            {{- include "harmony.env.secret" (dict "root" . "name" "LIVEKIT_API_SECRET") | nindent 12 }}
            {{- include "harmony.env.secret" (dict "root" . "name" "REDIS_PASSWORD") | nindent 12 }}
            # The whole livekit.yaml; $(VAR) references are expanded by the kubelet.
            - name: LIVEKIT_CONFIG
              value: |
                {{- toYaml $config | nindent 16 }}
          ports:
            - name: http
              containerPort: 7880
            - name: rtc-tcp
              containerPort: {{ $v.rtc.tcpPort }}
              protocol: TCP
            - name: rtc-udp
              containerPort: {{ $v.rtc.udpPort }}
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "harmony.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harmony.componentName" $ctx }}
  labels:
    {{- include "harmony.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "harmony.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 7880
      targetPort: http
{{- if and $v.rtc.service.enabled (not $v.hostNetwork) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harmony.componentName" (dict "root" . "component" "livekit-rtc") }}
  labels:
    {{- include "harmony.labels" $ctx | nindent 4 }}
  {{- with $v.rtc.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.rtc.service.type }}
  {{- if and (eq $v.rtc.service.type "LoadBalancer") $v.rtc.service.loadBalancerIP }}
  loadBalancerIP: {{ $v.rtc.service.loadBalancerIP }}
  {{- end }}
  {{- if or (eq $v.rtc.service.type "LoadBalancer") (eq $v.rtc.service.type "NodePort") }}
  externalTrafficPolicy: {{ $v.rtc.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "harmony.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: rtc-tcp
      port: {{ $v.rtc.tcpPort }}
      targetPort: rtc-tcp
      protocol: TCP
      {{- if eq $v.rtc.service.type "NodePort" }}
      nodePort: {{ $v.rtc.tcpPort }}
      {{- end }}
    - name: rtc-udp
      port: {{ $v.rtc.udpPort }}
      targetPort: rtc-udp
      protocol: UDP
      {{- if eq $v.rtc.service.type "NodePort" }}
      nodePort: {{ $v.rtc.udpPort }}
      {{- end }}
{{- end }}
{{- end }}
