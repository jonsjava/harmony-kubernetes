{{- include "harmony.validate" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harmony.secretName" . }}
  labels:
    {{- include "harmony.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    # Generated values (database role password, keys) must outlive an uninstall.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  REDIS_PASSWORD: {{ include "harmony.secretValue" (dict "root" . "key" "REDIS_PASSWORD" "value" $s.redisPassword "generate" (randAlphaNum 40)) | quote }}
  INTERNAL_API_SECRET: {{ include "harmony.secretValue" (dict "root" . "key" "INTERNAL_API_SECRET" "value" $s.internalApiSecret "generate" (randAlphaNum 64)) | quote }}
  LISTENER_PASSWORD: {{ include "harmony.secretValue" (dict "root" . "key" "LISTENER_PASSWORD" "value" $s.listenerPassword "generate" (randAlphaNum 40)) | quote }}
  LIVEKIT_API_KEY: {{ include "harmony.secretValue" (dict "root" . "key" "LIVEKIT_API_KEY" "value" $s.livekitApiKey "generate" (printf "API%s" (randAlphaNum 12))) | quote }}
  LIVEKIT_API_SECRET: {{ include "harmony.secretValue" (dict "root" . "key" "LIVEKIT_API_SECRET" "value" $s.livekitApiSecret "generate" (randAlphaNum 64)) | quote }}
  BRIDGE_HOST_SECRET: {{ include "harmony.secretValue" (dict "root" . "key" "BRIDGE_HOST_SECRET" "value" $s.bridgeHostSecret "generate" (randAlphaNum 64)) | quote }}
  VAPID_PUBLIC_KEY: {{ include "harmony.secretValue" (dict "root" . "key" "VAPID_PUBLIC_KEY" "value" $s.vapidPublicKey "generate" "") | quote }}
  VAPID_PRIVATE_KEY: {{ include "harmony.secretValue" (dict "root" . "key" "VAPID_PRIVATE_KEY" "value" $s.vapidPrivateKey "generate" "") | quote }}
  MEDIA_URL_SECRET: {{ $s.mediaUrlSecret | quote }}
  KLIPY_API_KEY_ADS: {{ $s.klipyApiKeyAds | quote }}
  KLIPY_API_KEY_NOADS: {{ $s.klipyApiKeyNoads | quote }}
  FCM_SERVICE_ACCOUNT_JSON: {{ $s.fcmServiceAccountJson | quote }}
{{- end }}
{{- if or (not .Values.supabase.existingSecret) (not .Values.supabase.db.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harmony.componentName" (dict "root" . "component" "supabase") }}
  labels:
    {{- include "harmony.labels" (dict "root" . "component" "supabase") | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.supabase.existingSecret }}
  {{ .Values.supabase.existingSecretKeys.anonKey }}: {{ .Values.supabase.anonKey | quote }}
  {{ .Values.supabase.existingSecretKeys.serviceRoleKey }}: {{ .Values.supabase.serviceRoleKey | quote }}
  {{- end }}
  {{- if not .Values.supabase.db.existingSecret }}
  dbPassword: {{ .Values.supabase.db.password | quote }}
  {{- end }}
{{- end }}
