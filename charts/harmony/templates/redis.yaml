{{- if .Values.redis.enabled }}
{{- $c := "redis" }}
{{- $v := .Values.redis }}
{{- $ctx := dict "root" . "component" $c }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "harmony.componentName" $ctx }}
  labels:
    {{- include "harmony.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "harmony.componentName" $ctx }}
  selector:
    matchLabels:
      {{- include "harmony.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harmony.labels" $ctx | nindent 8 }}
    spec:
      {{- include "harmony.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "harmony.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ include "harmony.thirdPartyImage" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # BullMQ needs noeviction: an evicted job key loses the job.
          # maxmemory: MAXMEMORY, else MAXMEMORY_PERCENT of the cgroup memory
          # limit ($$ escapes the kubelet's $(VAR) expansion).
          command:
            - sh
            - -ec
            - |
              mm="$MAXMEMORY"
              if [ -z "$mm" ]; then
                lim=""
                if [ -r /sys/fs/cgroup/memory.max ]; then
                  lim="$$(cat /sys/fs/cgroup/memory.max)"
                elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
                  lim="$$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)"
                fi
                case "$lim" in
                  ''|max|*[!0-9]*) ;;
                  *) if [ "$lim" -lt 1000000000000000 ]; then mm="$$((lim / 100 * MAXMEMORY_PERCENT))"; fi ;;
                esac
              fi
              set -- --appendonly yes --maxmemory-policy noeviction --dir /data
              if [ -n "$mm" ]; then
                echo "maxmemory $mm"
                set -- "$@" --maxmemory "$mm"
              else
                echo "no memory limit: maxmemory unset"
              fi
              exec redis-server "$@" --requirepass "$REDIS_PASSWORD"
          env:
            {{- include "harmony.env.secret" (dict "root" . "name" "REDIS_PASSWORD") | nindent 12 }}
            - name: MAXMEMORY
              value: {{ $v.maxmemory | quote }}
            - name: MAXMEMORY_PERCENT
              value: {{ $v.maxmemoryPercent | int | toString | quote }}
            - name: REDISCLI_AUTH
              value: $(REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- if $v.metrics.enabled }}
        - name: metrics
          image: {{ include "harmony.thirdPartyImage" $v.metrics.image }}
          imagePullPolicy: {{ $v.metrics.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            {{- include "harmony.env.secret" (dict "root" . "name" "REDIS_PASSWORD") | nindent 12 }}
            {{- if $v.metrics.queues }}
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS
              value: {{ include "harmony.redis.queueKeys" . | quote }}
            {{- else if $v.metrics.queueKeyPattern }}
            - name: REDIS_EXPORTER_CHECK_KEYS
              value: {{ printf "db0=%s" $v.metrics.queueKeyPattern | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml $v.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $v.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- include "harmony.scheduling" $v | nindent 6 }}
  {{- if $v.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml $v.persistence.accessModes | nindent 10 }}
        {{- with $v.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harmony.componentName" $ctx }}
  labels:
    {{- include "harmony.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "harmony.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    {{- if $v.metrics.enabled }}
    - name: metrics
      port: 9121
      targetPort: metrics
    {{- end }}
{{- end }}
