# =============================================================================
# Harmony Helm chart
# =============================================================================
# Minimum to install: harmony.domain, harmony.adminEmail, supabase.internalUrl,
# supabase.anonKey + supabase.serviceRoleKey (or supabase.existingSecret) and
# supabase.db.host + supabase.db.password (or supabase.db.existingSecret).
# See README.md for the full walkthrough, including Supabase.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# -----------------------------------------------------------------------------
# Instance
# -----------------------------------------------------------------------------
harmony:
  # Public domain of the instance, no scheme (required). ActivityPub ids derive
  # from it: choose it once.
  domain: ""
  # Public host of the Supabase API (Kong). Default: db.<domain>.
  dbDomain: ""
  # Public host of LiveKit signalling. Default: live.<domain>.
  liveDomain: ""
  instanceName: Harmony
  # Contact address: VAPID subject (push services see it). Required.
  adminEmail: ""
  # open | invite | closed. Written to instance_config.open_registration once a
  # local admin exists (never opened before that). Empty leaves it alone.
  # GoTrue's sign-up switch (GOTRUE_DISABLE_SIGNUP) lives in your Supabase
  # release: false for open, true for invite/closed.
  registration: ""
  # Comma-separated GoTrue provider ids the sign-in page offers (google,github,twitch).
  enabledOAuthProviders: ""
  termsUrl: ""
  privacyUrl: ""
  statusUrl: ""

# Harmony's own images (web, federation, bot-gateway), published by upstream
# for linux/amd64 and linux/arm64.
image:
  registry: ghcr.io/y4my4my4m
  # Default: the chart's appVersion. "edge" follows upstream master.
  tag: ""
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Supabase (not deployed by this chart; see README.md "Supabase")
# -----------------------------------------------------------------------------
supabase:
  # Kong as pods reach it (required), e.g. http://supabase-supabase-kong.supabase.svc:8000
  # or https://<project>.supabase.co for Supabase Cloud.
  internalUrl: ""
  # URL browsers and other servers use. Default: https://<dbDomain>.
  publicUrl: ""
  # Serve dbDomain through this chart's router (Kong behind it): adds Harmony's
  # logout-scope rule, the WebP Accept pin and the public media cache. Turn off
  # with Supabase Cloud or when Kong has its own ingress.
  proxy:
    enabled: true
  anonKey: ""
  serviceRoleKey: ""
  # Secret holding the two keys instead of the values above.
  existingSecret: ""
  existingSecretKeys:
    anonKey: anonKey
    serviceRoleKey: serviceRoleKey
  # Largest upload storage-api accepts (its FILE_SIZE_LIMIT), bytes. Written to
  # instance_config.upload_ceiling_bytes by the migrations job.
  fileSizeLimit: 52428800
  # Postgres, for the migrations job and the worker's LISTEN connection
  # (session mode, port 5432; not through a transaction pooler).
  db:
    host: ""
    port: 5432
    database: postgres
    # A role that can create tables and functions in public (postgres in
    # self-hosted Supabase).
    user: postgres
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password
    # libpq sslmode for the job and the listener: disable, require, verify-full ...
    sslmode: disable

# -----------------------------------------------------------------------------
# Secrets generated by the chart
# -----------------------------------------------------------------------------
# Generated once and kept across upgrades (looked up from the release's Secret;
# the Secret carries helm.sh/resource-policy: keep). A value set here wins.
secrets:
  # Secret with every key below already present; the chart then creates none.
  existingSecret: ""
  redisPassword: ""
  internalApiSecret: ""
  listenerPassword: ""
  livekitApiKey: ""
  livekitApiSecret: ""
  bridgeHostSecret: ""
  # Web Push. Empty disables Web Push and UnifiedPush. Generate with:
  #   npx web-push generate-vapid-keys
  vapidPublicKey: ""
  vapidPrivateKey: ""
  # HMAC key of attachment URLs sent to other instances (32+ chars); empty derives it.
  mediaUrlSecret: ""
  # GIF search (Klipy); empty disables it.
  klipyApiKeyAds: ""
  klipyApiKeyNoads: ""
  # Firebase service account JSON for the Android app's FCM push.
  fcmServiceAccountJson: ""

# -----------------------------------------------------------------------------
# Defaults shared by Harmony's Node services
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

commonLabels: {}
commonAnnotations: {}

# -----------------------------------------------------------------------------
# Web app (Vue SPA on nginx; writes /config.json from its env at start)
# -----------------------------------------------------------------------------
web:
  replicaCount: 2
  image:
    repository: harmony-web
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraEnv: []
  # KEDA ScaledObject (see "autoscaling" notes at the end of this file).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    cpu: 75
    memory: null
    extraTriggers: []

# -----------------------------------------------------------------------------
# Router: Caddy, plain HTTP behind your Ingress/Gateway. Carries Harmony's
# content-negotiated routes (Accept, User-Agent, cookie) that an Ingress
# cannot express, ported from upstream's self-host/Caddyfile.
# -----------------------------------------------------------------------------
router:
  replicaCount: 2
  image:
    repository: caddy
    tag: 2.10-alpine
    pullPolicy: IfNotPresent
  # Peers whose X-Forwarded-For/X-Real-IP Caddy trusts (your ingress pods).
  trustedProxies: private_ranges
  maxBodySize: 50MB
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    cpu: 75
    memory: null
    extraTriggers: []

# -----------------------------------------------------------------------------
# Federation backend: one image, two roles
# -----------------------------------------------------------------------------
federation:
  image:
    repository: harmony-federation
  logLevel: info
  # Express trust proxy: peers allowed to set X-Real-IP (the router's pod IP).
  trustProxy: "loopback, uniquelocal"
  # sfu | p2p | hybrid
  webrtcMode: hybrid
  pushRelayEnabled: false
  # Extra env for both roles (list of EnvVar) and envFrom sources.
  extraEnv: []
  extraEnvFrom: []

  server:
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      cpu: 70
      memory: null
      extraTriggers: []

  worker:
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # Scales the worker on BullMQ backlog (Redis lists harmony:<queue>:wait).
    # CAUTION: every worker replica also runs the 30 s delivery-retry pass over
    # federation_delivery_queue, which claims no rows; with several replicas a
    # retry can be delivered twice. Upstream runs one worker. Keep maxReplicas
    # low and read README.md "Autoscaling" before enabling.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      cpu: null
      memory: null
      # Waiting jobs per replica before KEDA adds one.
      queueLengthTarget: 50
      queues:
        - federate-post
        - federate-channel-message
        - federate-channel-message-edit
        - federate-channel-message-delete
        - federate-reaction
        - federate-channel-reaction
        - federate-message-reaction
        - federate-dm
        - federate-follow
        - federate-profile
        - send-push-notification
        - deliver-outgoing-webhook
      extraTriggers: []

# -----------------------------------------------------------------------------
# Public media cache (nginx) between the router and Kong; only with supabase.proxy
# -----------------------------------------------------------------------------
mediaCache:
  enabled: true
  image:
    repository: nginx
    tag: 1.29-alpine
    pullPolicy: IfNotPresent
  maxSize: 2g
  persistence:
    # false: emptyDir (cache lost on restart, which is harmless).
    enabled: false
    size: 4Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Redis (BullMQ, cache, presence, rate limits, LiveKit state)
# -----------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
  # Redis runs with noeviction (BullMQ must never lose a job key), so at
  # maxmemory it refuses writes instead of dropping data. maxmemory is set at
  # container start to this share of the container's memory limit, read from
  # the cgroup, so it follows a limit the VPA changes. Without a limit, no
  # maxmemory is set. An explicit maxmemory (e.g. "850mb") wins.
  maxmemoryPercent: 85
  maxmemory: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # VerticalPodAutoscaler for Redis memory (needs the VPA components installed).
  # Queue depth lives in Redis memory; more pods would not help (BullMQ needs a
  # single primary), a bigger pod does.
  #   updateMode Off:   recommendations only (kubectl describe vpa)
  #   Initial:          applied when the pod is (re)created
  #   Recreate:         VPA evicts the pod to apply them (brief Redis restart;
  #                     AOF keeps the queues)
  #   InPlaceOrRecreate: resize without restart where the cluster supports it
  vpa:
    enabled: false
    updateMode: "Off"
    minAllowed: { memory: 256Mi }
    maxAllowed: { memory: 8Gi }
    # RequestsAndLimits keeps the limit/request ratio, so maxmemory follows.
    controlledValues: RequestsAndLimits

  # Prometheus metrics: a redis_exporter sidecar on :9121.
  metrics:
    enabled: false
    image:
      repository: oliver006/redis_exporter
      tag: v1.96.0
      pullPolicy: IfNotPresent
    # Queue lengths as redis_key_size{key="harmony:<queue>:wait"}. With queues
    # empty the exporter SCANs for the pattern on every scrape; listing the
    # queues looks the keys up directly instead (cheaper with many keys).
    queueKeyPattern: "harmony:*:wait"
    queues: []
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    serviceMonitor:
      # Prometheus Operator ServiceMonitor.
      enabled: false
      interval: 30s
      labels: {}
    prometheusRule:
      # Prometheus Operator PrometheusRule with the alerts below.
      enabled: false
      labels: {}
      # Redis memory use as a share of maxmemory.
      memoryWarningRatio: 0.75
      memoryCriticalRatio: 0.9
      # Waiting jobs in any one queue, sustained for queueBacklogFor.
      queueBacklogThreshold: 1000
      queueBacklogFor: 15m
      # Any extra rules, appended to the group.
      extraRules: []

  # With enabled: false. The password comes from secrets.redisPassword.
  external:
    host: ""
    port: 6379
    tls: false

# -----------------------------------------------------------------------------
# Bot gateway (bots, Discord bridge)
# -----------------------------------------------------------------------------
botGateway:
  enabled: false
  image:
    repository: harmony-bot-gateway
  # https or localhost only (the gateway sends its secret nowhere else).
  # Default https://<domain>: needs pods to reach the public address.
  federationBackendUrl: ""
  trustProxy: "loopback, linklocal, uniquelocal"
  # The gateway keeps WebSocket sessions in memory: one replica.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Discord bridge host (needs botGateway.enabled)
# -----------------------------------------------------------------------------
discordBridge:
  enabled: false
  image:
    repository: ghcr.io/y4my4my4m/harmony-discord-bridge
    tag: "2"
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# LiveKit voice/video
# -----------------------------------------------------------------------------
# Signalling (7880) goes through the Ingress at liveDomain. Media needs TCP
# rtc.tcpPort and UDP rtc.udpPort reachable from clients at the address LiveKit
# advertises: either hostNetwork, or the rtc Service (LoadBalancer) with
# rtc.nodeIP set to its external IP. The container and public port numbers must
# match.
livekit:
  enabled: false
  image:
    repository: livekit/livekit-server
    tag: v1.9.4
    pullPolicy: IfNotPresent
  hostNetwork: false
  rtc:
    tcpPort: 7881
    udpPort: 7882
    # Address advertised in ICE candidates; empty with useExternalIP queries STUN.
    nodeIP: ""
    useExternalIP: true
    service:
      enabled: true
      type: LoadBalancer
      annotations: {}
      loadBalancerIP: ""
      externalTrafficPolicy: Local
  logLevel: info
  # YAML merged over the generated livekit.yaml (e.g. turn:, room:).
  extraConfig: {}
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 2Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Exposure
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  # e.g. cert-manager.io/cluster-issuer: letsencrypt
  # Behind ingress-nginx, raise body size and WebSocket timeouts:
  #   nginx.ingress.kubernetes.io/proxy-body-size: 50m
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}
  tls:
    enabled: true
    # One certificate for domain, dbDomain and liveDomain.
    secretName: ""

# Gateway API HTTPRoutes instead of (or besides) the Ingress.
gateway:
  enabled: false
  parentRefs: []
  #  - name: public
  #    namespace: gateway-system
  #    sectionName: https
  annotations: {}

# -----------------------------------------------------------------------------
# Database migrations (Helm hook after install and upgrade)
# -----------------------------------------------------------------------------
# Applies upstream's db_schema/migrations, as self-host/bootstrap.sh does: the
# ledger supabase_migrations.schema_migrations decides what runs. The
# migrations are fetched from git at the chart's appVersion.
migrations:
  enabled: true
  git:
    repository: https://github.com/y4my4my4m/harmony
    # Default: v<appVersion>.
    ref: ""
  gitImage:
    repository: alpine/git
    tag: "2.49.1"
    pullPolicy: IfNotPresent
  psqlImage:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  # Seconds to wait for the Realtime, Storage and Auth schemas Supabase's own
  # services create.
  schemaWaitSeconds: 300
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

# -----------------------------------------------------------------------------
# First admin account (Helm hook after the migrations)
# -----------------------------------------------------------------------------
# Creates the account through GoTrue's admin API, its profile, its keys, and
# makes it an instance admin; an existing account is only promoted. Safe to
# keep enabled: re-runs change nothing.
admin:
  create: false
  email: ""
  username: ""
  displayName: ""
  # Secret with key "password" (8+ characters). Required with create: true.
  existingSecret: ""
  existingSecretPasswordKey: password

# -----------------------------------------------------------------------------
# KEDA autoscaling
# -----------------------------------------------------------------------------
# Each component's `autoscaling` block renders a keda.sh/v1alpha1 ScaledObject
# (KEDA 2.10+ must be installed). The Deployment then leaves `replicas` to KEDA.
#   cpu / memory: target average utilisation in percent (null: no trigger);
#                 needs resources.requests of that kind.
#   extraTriggers: raw KEDA triggers appended (prometheus, cron, ...).
keda:
  pollingInterval: 30
  cooldownPeriod: 300
  # spec.advanced.horizontalPodAutoscalerConfig, applied to every ScaledObject.
  horizontalPodAutoscalerConfig:
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
