name: Release chart

# On every push to main that changes the chart: when charts/harmony/Chart.yaml
# carries a version not released yet, chart-releaser
#   - packages the chart and creates the GitHub Release harmony-<version>
#     with the .tgz attached,
#   - adds it to index.yaml on the gh-pages branch (the Helm repository at
#     https://<owner>.github.io/<repo>), and
#   - pushes it to oci://ghcr.io/<owner>/charts/harmony.
# Bump the chart version to publish; an existing version is skipped.
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

concurrency:
  group: release-chart
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Release and the gh-pages index
  packages: write   # ghcr.io OCI push

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint before publishing
        run: |
          for f in charts/harmony/ci/*-values.yaml; do
            helm lint charts/harmony -f "$f" --strict
          done

      - name: Publish
        uses: helm/chart-releaser-action@v1.8.0
        with:
          charts_dir: charts
          skip_existing: true
          oci_registry_url: oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: "true"
